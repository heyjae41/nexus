  <h1>회의록 요약, LLM에게 맡기는 법</h1>
  <p>회의는 끝났는데 정리가 남았습니다. 이 가이드는 LLM으로 회의록 요약을 자동화하는 방법을 다룹니다.</p><h2>1. 녹취를 텍스트로</h2><p>회의 녹음을 STT로 변환합니다. 사내 보안 정책상 외부 업로드가 불가하면 로컬 모델을 사용하세요.</p><h2>2. 요약 프롬프트 설계</h2><p>결정사항, 액션아이템, 담당자, 기한 네 가지를 표로 뽑는 프롬프트가 가장 실용적입니다.</p><p>마지막으로 공유 채널에 자동 게시하면 끝입니다.</p>
