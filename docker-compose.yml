# EDU.AI 배포 스택 (docker compose up -d --build)
# DB/Redis 포트는 외부에 노출하지 않는다 (로컬 개발용 PG/Redis 와 충돌 방지).
# 웹 진입점: http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      # 컨테이너 시계를 호스트(KST)와 맞춘다 — 로그 타임스탬프용.
      # SQL 의 TimeZone 은 postgresql.conf 의 UTC 가 이기므로 질의 의미는 그대로다.
      TZ: Asia/Seoul
      POSTGRES_DB: ${DB_NAME:-paybooc_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      # 기본 비밀번호 없음 — .env 의 DB_PASSWORD 가 비어 있으면 compose 가 기동을 거부한다
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-paybooc_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      TZ: Asia/Seoul
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CONTENTS_DIR: /app/contents
      MEDIA_DIR: /app/media
    volumes:
      - ./contents:/app/contents
      # 컨테이너는 uid 1000 비루트 — Linux 호스트에서는 ./media 가 uid 1000 소유여야 한다 (docs/SETUP.md)
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Seoul
      BACKEND_UPSTREAM: backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
