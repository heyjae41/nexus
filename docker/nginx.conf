limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 내부 운영 API 는 외부에 노출하지 않는다 (docker 내부에서만 호출)
    location /api/internal/ {
        return 403;
    }

    # 쓰기 API(좋아요 등) 남용 방지: IP 당 분당 10회
    location ~ ^/api/articles/[0-9]+/like$ {
        limit_req zone=api_write burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 프록시
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
