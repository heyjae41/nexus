limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# 레이트리밋의 기준 주소는 ALB 가 아니라 실제 클라이언트여야 한다 — 아니면 모든 사용자가
# ALB 주소 하나로 묶여 공격자 한 명이 전원의 로그인·가입을 잠근다.
# 신뢰 홉은 ALB 가 있는 dev VPC 대역만(app 172.25.72.0/24, hub 172.25.73.128/26, egress 172.25.73.192/26).
# RFC1918 전체를 신뢰하면 사설 주소를 가진 사내 클라이언트가 X-Forwarded-For 를 조작해 자기 주소를
# 고를 수 있다(리밋 회피·타인 버킷 채우기). X-Forwarded-For 를 오른쪽부터 거슬러 첫 비신뢰 주소를 쓴다.
# 다른 환경(운영 VPC)으로 옮기면 이 대역을 그 VPC 로 바꿀 것.
set_real_ip_from 172.25.72.0/24;
set_real_ip_from 172.25.73.128/26;
set_real_ip_from 172.25.73.192/26;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# TLS 는 ALB 가 끝내므로 $scheme 은 항상 http 다. 앞단이 준 X-Forwarded-Proto 를 그대로 넘겨야
# 백엔드가 Secure 쿠키를 발급한다. 직접 접속(로컬 compose)이면 $scheme 으로 떨어진다.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~*^https" https;
}
# HSTS 는 https 응답에만 — http 로 직접 쓰는 로컬 compose 에 붙으면 브라우저가 그 호스트를 잠근다
map $forwarded_proto $hsts_value {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    # 기본값 1MB 는 본문 사진 업로드를 연결 종료로 버린다. 앱 상한은 5MB.
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # 주의: add_header 는 상속이 아니라 대체 — server/http 레벨에 공통 헤더를 추가하면 add_header 가
    # 있는 location 에서 조용히 사라진다. 보안 헤더(CSP 등)는 security-headers.conf 를 블록마다 include.
    # 해시된 빌드 자산은 내용이 바뀌면 파일명이 바뀌므로 장기 캐시가 안전하다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA 라우팅 — index.html 은 항상 재검증(no-cache, ETag 304)해야
    # 배포가 기존 방문자에게 즉시 반영된다 (헤더 없으면 휴리스틱 캐시로 구버전 실행)
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # 내부 운영 API 는 외부에 노출하지 않는다 (파드 안 루프백 또는 X-Internal-Token 으로만 호출)
    location /api/internal/ {
        return 403;
    }

    # 로그인·가입 brute-force 방지: IP 당 분당 10회 (완화된 비밀번호 정책 보완)
    location ~ ^/api/(auth/(login|register)|members)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 쓰기 API(좋아요 등) 남용 방지: IP 당 분당 10회.
    # 경로 세그먼트는 [0-9]+ 가 아니라 [^/]+ — "+1", "1_0", "%201" 도 앱이 정수 1 로 받아들여
    # 아래 /api/ 블록(무제한)으로 새던 우회를 막는다.
    location ~ ^/api/articles/[^/]+/like$ {
        limit_req zone=api_write burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # API 프록시
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
