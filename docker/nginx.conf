limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 주의: add_header 는 상속이 아니라 대체 — server/http 레벨에 공통 헤더(CSP 등)를
    # 추가하면 아래 두 location 에서 조용히 사라진다. 그때는 각 블록에도 재선언할 것.
    # 해시된 빌드 자산은 내용이 바뀌면 파일명이 바뀌므로 장기 캐시가 안전하다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 라우팅 — index.html 은 항상 재검증(no-cache, ETag 304)해야
    # 배포가 기존 방문자에게 즉시 반영된다 (헤더 없으면 휴리스틱 캐시로 구버전 실행)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 내부 운영 API 는 외부에 노출하지 않는다 (docker 내부에서만 호출)
    location /api/internal/ {
        return 403;
    }

    # 로그인·가입 brute-force 방지: IP 당 분당 10회 (완화된 비밀번호 정책 보완)
    location ~ ^/api/(auth/(login|register)|members)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 쓰기 API(좋아요 등) 남용 방지: IP 당 분당 10회
    location ~ ^/api/articles/[0-9]+/like$ {
        limit_req zone=api_write burst=5 nodelay;
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 프록시
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
