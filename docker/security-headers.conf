# 보안 응답 헤더 — 모든 location 블록에서 include 한다.
# add_header 는 상속이 아니라 "대체" 라서 server 레벨에 두면 add_header 가 있는 location 에서
# 조용히 사라진다. 새 location 을 추가하면 반드시 이 파일을 include 할 것
# (회귀 가드: test/frontend/NginxSecurityHeaders.test.js).
#
# CSP 메모
# - script-src: 번들('self') + GA(gtag.js). 인라인 스크립트는 금지 — GA 부트스트랩은 public/ga-init.js.
# - style-src 'unsafe-inline': React 인라인 스타일과 글 키비주얼 SVG 의 style 속성 때문에 필요.
# - img-src https: data: — 수집 글 본문의 외부 이미지, 인제스트 data:image, GA 비콘.
# - connect-src: API('self') + 핫픽(open.paybooc.co.kr) + GA 수집 엔드포인트.
# - frame-ancestors 'none' + X-Frame-Options DENY: 권한관리 화면 클릭재킹 방지.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://open.paybooc.co.kr https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://stats.g.doubleclick.net; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# https 로 들어온 요청에만 붙는다 ($hsts_value 는 nginx.conf 의 map, 빈 값이면 nginx 가 헤더를 생략)
add_header Strict-Transport-Security $hsts_value always;
